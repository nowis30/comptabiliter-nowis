<style>
/* Mise en page : grand livre — barre d'onglets en haut, tableaux denses, fiche d'édition en fenêtre. */
:root{
  --bg:#f6f7f4; --surface:#ffffff; --ink:#1b241f; --muted:#5d6a62; --line:#d9ded8;
  --accent:#1f6b4a; --accent-ink:#ffffff; --accent-soft:#e3f0e9;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --accent:#58b88a; --accent-ink:#0d1611; --accent-soft:#1f3329;
  --warn:#e6b25a; --warn-soft:#3a2e15; --bad:#ec8a83; --bad-soft:#3d201e; --off:#75817a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --surface:#1a221e; --ink:#e6ece8; --muted:#9aa8a0; --line:#2e3a33;
  --accent:#58b88a; --accent-ink:#0d1611; --accent-soft:#1f3329;
  --warn:#e6b25a; --warn-soft:#3a2e15; --bad:#ec8a83; --bad-soft:#3d201e; --off:#75817a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45}
.wrap{max-width:1120px;margin:0 auto;padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
header.top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:baseline;justify-content:space-between}
h1{font-family:var(--cond);font-size:26px;margin:0;letter-spacing:.01em}
h1 small{font-family:var(--sans);font-weight:400;font-size:13px;color:var(--muted);margin-left:8px}
h2{font-family:var(--cond);font-size:19px;margin:0;text-wrap:balance}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0;font-weight:600}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)} .small{font-size:13px}
nav{display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid var(--line)}
nav a{padding:9px 12px;text-decoration:none;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;font-weight:500}
nav a.on{color:var(--ink);border-bottom-color:var(--accent)}
nav a .n{background:var(--warn-soft);color:var(--warn);border-radius:9px;padding:0 6px;font-size:12px;margin-left:4px}
section{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.tile{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.tile b{font-family:var(--mono);font-weight:500;font-size:21px;font-variant-numeric:tabular-nums}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line)}

th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:var(--accent-soft)}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.off td{color:var(--off)} tr.off td.num{text-decoration:line-through}

.pill.ok{background:var(--accent-soft);color:var(--accent)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.flag{color:var(--warn);font-size:13px;display:block;margin-top:2px}

button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--surface);border:1px solid var(--line);padding:7px 12px;border-radius:4px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}

button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

input.money{font-family:var(--mono);text-align:right}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
label.check{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--ink)} label.check input{width:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.span2{grid-column:span 2} @media(max-width:520px){.span2{grid-column:auto}}
dialog{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0;width:min(720px,calc(100vw - 24px));max-height:calc(100vh - 24px);border-radius:6px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{display:flex;flex-direction:column;gap:14px;padding:18px}
.note{border-left:3px solid var(--warn);background:var(--warn-soft);padding:10px 12px;color:var(--ink)}
.info{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 12px}
.depot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:150px;padding:20px;border:2px dashed var(--line);border-radius:10px;background:var(--surface);text-align:center;cursor:pointer}
.depot:hover,.depot.survol{border-color:var(--accent);background:var(--accent-soft)}
.depot b{font-size:16px}
.depot input{position:absolute;width:1px;height:1px;opacity:0}
.formline{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.formline:last-child{border-bottom:0}
.formline .no{font-family:var(--mono);font-size:13px;border:1px solid var(--ink);text-align:center;padding:1px 0}
.formline .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:16px}
.formbox{border:1px solid var(--line)}
.pieces{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.piece{display:flex;flex-direction:column;gap:4px;font-size:12px;max-width:140px}
.piece img{max-height:110px;border:1px solid var(--line);object-fit:cover}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:14px}
.kv span:nth-child(odd){color:var(--muted)}
.formline input.fv{width:130px}
.formline .hint{display:block;font-size:12px;color:var(--warn)}
.formhead{padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--line);font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.formline.tot{font-weight:600}
@media(max-width:520px){.formline{grid-template-columns:44px 1fr}.formline input.fv,.formline .v{grid-column:2;justify-self:end}}
.pay{display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr auto;gap:6px;align-items:center}
@media(max-width:560px){.pay{grid-template-columns:1fr 1fr}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:4px;z-index:50}
textarea{min-height:60px;resize:vertical}
</style>

<script>(function(){
"use strict";
/* Pont entre l'application et le serveur local : remplace le stockage de la version en ligne. */
const COLS=["ecritures","reglages","formulaires","contacts","documents","recurrences","trajets","annexes","journal","comptes","immobilisations","rapprochements"];
const L={};let D={},E={},connecte=true,msg="";
const H={"Content-Type":"application/json","X-Compta":"1"};
async function api(m,u,b){let r;try{r=await fetch(u,{method:m,headers:H,body:b===undefined?undefined:JSON.stringify(b),cache:"no-store"})}catch(e){throw{code:"unavailable",message:"Le serveur local ne répond pas."}}
  if(r.status===401){location.href="/connexion";throw{code:"not_granted",message:"Connexion requise."}}
  if(!r.ok){let j={};try{j=await r.json()}catch(e){}if(r.status===423){msg=j.message||"Période verrouillée.";setTimeout(barre,0)}throw{code:j.erreur||"unavailable",message:j.message||("Erreur "+r.status)}}
  return r.status===204?null:r.json()}
const clone=x=>x===undefined?undefined:JSON.parse(JSON.stringify(x));
const META={fromCache:false,hasPendingWrites:false};
const snapDoc=(c,id)=>{const d=D[c]&&D[c][id];return{id,exists:!!d,data:()=>d?clone(d):undefined,metadata:META}};
const snapCol=c=>{const docs=Object.keys(D[c]||{}).map(id=>snapDoc(c,id));return{docs,size:docs.length,empty:!docs.length,metadata:META,docChanges:()=>[]}};
const emit=c=>(L[c]||[]).forEach(f=>setTimeout(f,0));
const lien=(c,id)=>"/api/c/"+c+"/"+encodeURIComponent(id);
const enDataUrl=b=>new Promise((ok,ko)=>{if(!/^image\/(jpeg|png|webp)$/.test(b.type||""))return ko({code:"image_rejected",message:"Format d'image non accepté."});const f=new FileReader();f.onload=()=>ok(f.result);f.onerror=()=>ko({code:"image_rejected"});f.readAsDataURL(b)});

const init=(async()=>{const [d,e]=await Promise.all([api("GET","/api/donnees"),api("GET","/api/etat")]);D=d||{};E=e||{};
  COLS.forEach(c=>{D[c]=D[c]||{}});
  brancherAgent();
  window.comptaServeur={etat:()=>E,historique:q=>api("GET","/api/historique?"+new URLSearchParams(Object.entries(q||{}).filter(([k,v])=>v!==undefined&&v!=="").map(([k,v])=>[k,String(v)]))),
    clotures:()=>api("GET","/api/clotures"),cloturer:a=>api("POST","/api/cloturer",{annee:String(a)}),courrielEssai:a=>api("POST","/api/courriel/essai",{a}),
    envoisPrevus:()=>api("GET","/api/envois/prevus"),envoisExecuter:()=>api("POST","/api/envois/executer")};
  ouvrirFlux();barre();return true})();

function brancherAgent(){window.agentNowis=E.ia?{pdf:false,json:async(prompt,images)=>{const im=[];for(const b of images||[])im.push(await enDataUrl(b));return api("POST","/api/ia",{prompt,images:im})}}:null}
function ouvrirFlux(){const es=new EventSource("/api/evenements");let ouvert=false;
  es.onopen=async()=>{if(ouvert&&!connecte){try{const [d,e]=await Promise.all([api("GET","/api/donnees"),api("GET","/api/etat")]);E=e||{};brancherAgent();COLS.forEach(c=>{D[c]=d[c]||{};emit(c)})}catch(e){}}ouvert=true;connecte=true;barre()};
  es.onerror=()=>{connecte=false;barre()};
  es.addEventListener("sync",ev=>{try{E.sync=JSON.parse(ev.data);barre()}catch(e){}});
  es.addEventListener("change",async ev=>{let c="";try{c=JSON.parse(ev.data).col}catch(e){}if(!COLS.includes(c))return;try{D[c]=await api("GET","/api/c/"+c);emit(c)}catch(e){}})}

const docRef=(c,id)=>({id,path:c+"/"+id,
  get:async()=>{await init;return snapDoc(c,id)},
  set:async d=>{await init;await api("PUT",lien(c,id),d);(D[c]=D[c]||{})[id]=clone(d);emit(c)},
  update:async d=>{await init;if(!D[c]||!D[c][id])throw{code:"invalid_argument",message:"Document absent."};await api("PATCH",lien(c,id),d);D[c][id]={...D[c][id],...clone(d)};emit(c)},
  delete:async()=>{await init;await api("DELETE",lien(c,id));if(D[c])delete D[c][id];emit(c)},
  onSnapshot:(cb,err)=>{const f=()=>cb(snapDoc(c,id));(L[c]=L[c]||[]).push(f);init.then(f,e=>{if(err)err(e)});return()=>{L[c]=(L[c]||[]).filter(x=>x!==f)}}});
const db={doc:p=>{const [c,id]=String(p).split("/");return docRef(c,id)},
  collection:c=>({doc:id=>docRef(c,id||("m-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6))),get:async()=>{await init;return snapCol(c)},
    onSnapshot:(cb,err)=>{const f=()=>cb(snapCol(c));(L[c]=L[c]||[]).push(f);init.then(f,e=>{if(err)err(e)});return()=>{L[c]=(L[c]||[]).filter(x=>x!==f)}}})};
function telecharger(nom,data){const b=data instanceof Blob?data:new Blob([data],{type:"application/octet-stream"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=nom;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
const assets={upload:async(blob,o)=>{const type=(o&&o.type)||blob.type||"";let r;try{r=await fetch("/api/fichiers",{method:"POST",headers:{"Content-Type":type,"X-Compta":"1"},body:blob})}catch(e){throw{code:"store_unavailable"}}
    if(r.status===401){location.href="/connexion";throw{code:"not_granted"}}const j=await r.json().catch(()=>({}));if(!r.ok)throw{code:j.erreur||"store_unavailable",message:j.message};return j},
  list:async()=>({assets:[],usage:{}}),delete:async()=>undefined};
window.claude={use:async n=>n==="db"?db:n==="downloads"?{save:async({filename,data})=>{telecharger(filename,data);return{status:"saved"}}}:n==="assets"?assets:null};

let attente=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function barre(){let el=document.getElementById("serveurlocal");const h=document.querySelector("header.top");if(!h)return;
  if(!el){el=document.createElement("div");el.id="serveurlocal";el.className="info small";el.style.cssText="display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center";h.parentNode.insertBefore(el,h.nextSibling);
    el.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;msg="";
      if(b.dataset.a==="sv")location.href="/api/sauvegarde";
      else if(b.dataset.a==="rs")document.getElementById("sl-file").click();
      else if(b.dataset.a==="an"){attente=null;barre()}
      else if(b.dataset.a==="sy"){b.disabled=true;b.textContent="Synchronisation…";try{E.sync=await api("POST","/api/synchroniser")}catch(x){msg="Synchronisation impossible : "+(x.message||"erreur")}barre()}
      else if(b.dataset.a==="ap"){try{const r=await api("POST","/api/restaurer",attente);msg=`Sauvegarde restaurée : ${r.ecritures} écritures. L'état précédent est gardé dans ${r.copie_precedente}.`}catch(x){msg="Restauration impossible : "+(x.message||"erreur")}attente=null;barre()}});
    el.addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];if(e.target.id!=="sl-file"||!f)return;const r=new FileReader();
      r.onload=()=>{try{const x=JSON.parse(r.result);if(!x||typeof x.ecritures!=="object")throw 0;attente=x}catch(z){attente=null;msg="Ce fichier n'est pas une sauvegarde de Comptabilité Nowis."}barre()};r.readAsText(f);e.target.value=""})}
  if(attente){el.innerHTML=`<span><b>Remplacer toutes vos données par les ${Object.keys(attente.ecritures).length} écritures de cette sauvegarde${attente.enregistre?" du "+esc(new Date(attente.enregistre).toLocaleString("fr-CA",{dateStyle:"medium",timeStyle:"short"})):""} ?</b> Une copie de l'état actuel sera gardée.</span><button data-a="ap" class="danger">Oui, remplacer</button><button data-a="an">Annuler</button>`;return}
  el.innerHTML=`<span style="flex:1 1 280px">${connecte?`Serveur local · données dans <b>${esc(E.dossier||"le dossier donnees")}</b> · copie de sécurité automatique chaque jour.${copieTexte()}${E.adresses&&E.adresses.length?` Sur votre cellulaire (même Wi-Fi) : ${E.adresses.map(esc).join(" ou ")}`:""}`:`<b>Le serveur local ne répond plus.</b> Vérifiez que la fenêtre « Comptabilité Nowis » est toujours ouverte; la page se reconnectera toute seule.`} ${esc(msg)}</span>
   ${E.sync&&E.sync.active?`<span style="flex:1 1 100%">${syncTexte()}</span><button data-a="sy" ${E.sync.enCours?"disabled":""}>${E.sync.enCours?"Synchronisation…":"Synchroniser maintenant"}</button>`:""}
   <button data-a="sv">Télécharger une sauvegarde</button><button data-a="rs">Restaurer une sauvegarde</button><input type="file" id="sl-file" accept=".json,application/json" hidden>`}
function copieTexte(){const c=E.copie||{};if(!c.dossier)return " <b>Aucune copie hors de l'ordinateur</b> : voir « copie_externe » dans le LISEZ-MOI.";
  if(c.erreur)return ` <b>Copie hors de l'ordinateur impossible</b> : ${esc(c.erreur)}.`;
  return ` Copie hors de l'ordinateur dans <b>${esc(c.dossier)}</b>${c.derniere?" à "+esc(new Date(c.derniere).toLocaleTimeString("fr-CA",{hour:"2-digit",minute:"2-digit"})):""}.`}
function syncTexte(){const s=E.sync,noms=(s.sources||[]).map(x=>x.nom).join(" et ")||"CRM nowis.store";
  if(!s.derniere&&!s.erreur)return `${esc(noms)} : première synchronisation en cours…`;
  const r=s.resultat||{},h=s.derniere?new Date(s.derniere).toLocaleTimeString("fr-CA",{hour:"2-digit",minute:"2-digit"}):"",d=[r.nouvelles?r.nouvelles+" nouvelle(s)":"",r.misesAJour?r.misesAJour+" mise(s) à jour":"",r.contacts?r.contacts+" contact(s)":"",r.aVerifier?`<a href="#verifier">${r.aVerifier} à vérifier</a>`:""].filter(Boolean);
  const ok=(s.sources||[]).filter(x=>x.resultat).map(x=>x.nom);
  return `${ok.length?`${esc(ok.join(" et "))} : à jour à ${h}${d.length?" · dernière synchronisation : "+d.join(", "):""}.`:""}${s.erreur?` <b>Synchronisation impossible</b> — ${esc(s.erreur)}. Vos données locales restent utilisables.`:""}`}
setInterval(()=>{if(E.sync&&E.sync.active&&!attente&&!document.querySelector("#serveurlocal button[data-a=sy][disabled]"))barre()},60000);
document.addEventListener("DOMContentLoaded",barre);
})();
</script>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf=new Intl.NumberFormat("fr-CA",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt=c=>nf.format((c||0)/100)+" $";
const parse=s=>{const n=parseFloat(String(s??"").replace(/[\s $]/g,"").replace(",","."));return isFinite(n)?Math.round(n*100):0};
const inp=c=>((c||0)/100).toFixed(2).replace(".",",");
const today=()=>new Date().toISOString().slice(0,10);
const montantTaxe=(s,t)=>Math.round(s*Math.round(t*1000)/100000);

const TYPES={facture:"Facture",vente:"Vente au comptant",depense:"Dépense",loyer:"Loyer reçu"};
const STATUTS={payee:["Payée","ok"],impayee:["À recevoir / à payer","warn"],partielle:["Partielle","warn"],annulee:["Annulée",""],ecartee:["Écartée (test ou doublon)",""]};
const MODES=["Virement Interac","Débit","Crédit","Comptant","PayPal","Chèque","Autre"];
const CATS={
  revenu:["Gestion immobilière","Commission de location","Chanson personnalisée","Atelier","Marchandise (clés USB)","Autre revenu"],
  depense:["Marchandises achetées","Matériel et fournitures","Logiciels et abonnements","Publicité","Frais de bureau","Télécommunications","Déplacements","Honoraires professionnels","Frais bancaires","Bien durable (immobilisation)","Autre dépense"],
  immeuble:["Taxes municipales","Taxes scolaires","Assurances","Intérêts hypothécaires","Entretien et réparations","Services publics","Frais de gestion","Autre dépense d'immeuble"]};
/* ---------- Verrouillage des périodes ---------- */
const verrouDe=()=>regl.verrou||"";
const enVerrou=d=>!!(verrouDe()&&d&&String(d).slice(0,10)<=verrouDe());
const LIBRES=["paiements","statut","aVerifier","note","pieces","maj","crm","docId","rappels","envois","pasDeRappel"];
function changeVerrouillee(avant,apres){const v=verrouDe();if(!v||!(enVerrou(avant&&avant.date)||enVerrou(apres&&apres.date)))return "";
  const m=`Période verrouillée jusqu'au ${new Date(v+"T12:00:00").toLocaleDateString("fr-CA",{day:"numeric",month:"long",year:"numeric"})} : `;
  if(!avant)return m+"impossible d'ajouter une écriture datée de cette période.";
  if(!apres)return m+"impossible de supprimer cette écriture.";
  const prot=o=>JSON.stringify(Object.keys(o).filter(k=>!LIBRES.includes(k)&&k!=="id"&&o[k]!==undefined&&o[k]!==null&&o[k]!=="").sort().map(k=>[k,o[k]]));
  if(prot(avant)!==prot(apres))return m+"seuls les paiements reçus après cette date, les notes et les pièces jointes peuvent changer.";
  const anc=l=>JSON.stringify((l||[]).filter(x=>x.date&&x.date<=v).map(x=>JSON.stringify(x)).sort());
  return anc(avant.paiements)!==anc(apres.paiements)?m+"les paiements datés de cette période ne peuvent pas changer.":""}
const messageVerrou=d=>`Période verrouillée jusqu'au ${new Date(verrouDe()+"T12:00:00").toLocaleDateString("fr-CA",{day:"numeric",month:"long",year:"numeric"})} : cette date ne peut plus être modifiée.`;
const DEF={nom:"Création Nowis",proprietaire:"Simon Morin",adresse:"",telephone:"",courriel:"",noTPS:"",noTVQ:"",dateInscription:"",tauxTPS:5,tauxTVQ:9.975,frequence:"annuelle",interacCourriel:"",interacNote:"",paypalMe:"",lienCarte:"",verrou:"",rappelsAuto:false,rappelsDelai:3,rappelsIntervalle:14,rappelsMax:3,copieCourriel:"",prefixeFacture:"CN-"};

let db=null,dl=null,items=[],regl={...DEF},ready=false,annee=String(new Date().getFullYear()),filtre={ventes:"actives",q:""},taxe={du:"",au:""};

const compte=e=>e.statut!=="annulee"&&e.statut!=="ecartee";
/* Achat d'un bien durable : ses taxes donnent droit aux CTI/RTI, mais son coût passe à l'actif (compte 1500) et se déduit par l'amortissement, pas comme dépense. */
const CAT_IMMO="Bien durable (immobilisation)",estImmo=e=>e.type==="depense"&&e.categorie===CAT_IMMO,estCharge=e=>e.type==="depense"&&e.categorie!==CAT_IMMO;
const paye=e=>(e.paiements||[]).reduce((s,p)=>s+(p.montant||0),0);
const deLAnnee=e=>(e.date||"").startsWith(annee);
const estRevenu=e=>e.type==="facture"||e.type==="vente"||e.type==="loyer";
const sum=(a,f)=>a.reduce((s,e)=>s+(f(e)||0),0);
const part=e=>e.activite==="immeuble"?(e.part??100)/100:1;

function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2600)}

function vue(){const h=location.hash.slice(1);return VUES.some(v=>v[0]===h)?h:"apercu"}

/* ---------- Tableaux ---------- */
function pill(e){const [t,c]=STATUTS[e.statut]||[e.statut,""];return `<span class="pill ${c}">${t}</span>`}
function lignes(list,{tiers="Client",immeuble=false}={}){
  if(!list.length)return `<p class="muted">Aucune écriture ici pour ${annee}. Utilisez le bouton « Ajouter » pour en créer une.</p>`;
  list=[...list].sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const act=list.filter(compte);
  return `<div class="tablebox"><table><thead><tr><th>Date</th><th>N°</th><th>${tiers}</th><th>Description</th>${immeuble?"<th>Immeuble</th>":""}<th class="num">Avant taxes</th><th class="num">TPS</th><th class="num">TVQ</th><th class="num">Total</th><th>État</th></tr></thead><tbody>`+
  list.map(e=>`<tr class="click ${compte(e)?"":"off"}" data-id="${esc(e.id)}" tabindex="0"><td style="white-space:nowrap">${esc(e.date)}</td><td style="white-space:nowrap">${esc(e.numero||"—")}</td><td>${esc(e.tiers||"—")}</td><td>${esc(e.description||"")}<span class="small muted"> · ${esc(e.categorie||"")}</span>${e.aVerifier?`<span class="flag">À vérifier : ${esc(e.aVerifier)}</span>`:""}</td>${immeuble?`<td>${esc(e.immeuble||"")}</td>`:""}<td class="num">${fmt(e.sousTotal)}</td><td class="num">${fmt(e.tps)}</td><td class="num">${fmt(e.tvq)}</td><td class="num">${fmt(e.total)}</td><td>${pill(e)}</td></tr>`).join("")+
  `<tr class="total"><td colspan="${immeuble?5:4}">Total retenu (${act.length} écriture${act.length>1?"s":""})</td><td class="num">${fmt(sum(act,e=>e.sousTotal))}</td><td class="num">${fmt(sum(act,e=>e.tps))}</td><td class="num">${fmt(sum(act,e=>e.tvq))}</td><td class="num">${fmt(sum(act,e=>e.total))}</td><td></td></tr></tbody></table></div>`}
function chercher(list){const q=filtre.q.trim().toLowerCase();return q?list.filter(e=>[e.numero,e.tiers,e.description,e.categorie,e.immeuble].join(" ").toLowerCase().includes(q)):list}

function totaux(){
  const a=items.filter(e=>deLAnnee(e)&&compte(e)),n=a.filter(e=>e.activite==="nowis");
  const rev=n.filter(estRevenu),dep=[...n.filter(estCharge),...amortL(annee+"-01-01",annee+"-12-31")];
  return{rev:sum(rev,e=>e.sousTotal),dep:sum(dep,e=>e.sousTotal),aRecevoir:sum(rev,e=>Math.max(0,e.total-paye(e))),revL:rev,depL:dep,tous:a}}
function vApercu(){const t=totaux(),x=calcTaxes(annee+"-01-01",annee+"-12-31"),nv=items.filter(e=>e.aVerifier).length;
  const loy=t.tous.filter(e=>e.type==="loyer"),di=t.tous.filter(e=>e.activite==="immeuble"&&e.type==="depense");
  return `<section>
  ${nv||!regl.dateInscription?`<div class="note"><b>${nv+(regl.dateInscription?0:1)} point(s) à vérifier</b> avant de produire vos déclarations. <a href="#verifier">Voir la liste</a></div>`:""}
  ${recDues().length?`<div class="info"><b>${recDues().length} écriture(s) récurrente(s) à générer.</b> <a href="#recurrentes">Voir</a></div>`:""}${enRetard().length?`<div class="note"><b>${enRetard().length} facture(s) en retard de paiement.</b> <a href="#recurrentes">Préparer les rappels</a></div>`:""}
  ${barreCrm()}
  <h3>Création Nowis · ${annee}</h3>
  <div class="tiles">
   <div class="tile"><span class="small muted">Revenus avant taxes</span><b>${fmt(t.rev)}</b></div>
   <div class="tile"><span class="small muted">Dépenses avant taxes</span><b>${fmt(t.dep)}</b></div>
   <div class="tile"><span class="small muted">Bénéfice net</span><b>${fmt(t.rev-t.dep)}</b></div>
   <div class="tile"><span class="small muted">TPS ${x.netTPS<0?"à recevoir":"à remettre"}</span><b>${fmt(Math.abs(x.netTPS))}</b></div>
   <div class="tile"><span class="small muted">TVQ ${x.netTVQ<0?"à recevoir":"à remettre"}</span><b>${fmt(Math.abs(x.netTVQ))}</b></div>
   <div class="tile"><span class="small muted">Factures à recevoir</span><b>${fmt(t.aRecevoir)}</b></div>
  </div>
  <h3>Immeubles · ${annee} · votre part</h3>
  <div class="tiles">
   <div class="tile"><span class="small muted">Loyers encaissés</span><b>${fmt(sum(loy,e=>e.total*part(e)))}</b></div>
   <div class="tile"><span class="small muted">Dépenses d'immeubles</span><b>${fmt(sum(di,e=>e.total*part(e)))}</b></div>
  </div>
  <h3>Dernières écritures</h3>
  ${lignes(items.filter(deLAnnee).sort((a,b)=>(b.date||"").localeCompare(a.date||"")).slice(0,8),{tiers:"Client / fournisseur"})}
  </section>`}
function barre(types,label){return `<div class="row between"><div class="row"><input id="q" placeholder="Rechercher…" value="${esc(filtre.q)}" style="width:200px"><select id="fv" style="width:auto"><option value="actives" ${filtre.ventes==="actives"?"selected":""}>Écritures retenues</option><option value="ecartees" ${filtre.ventes==="ecartees"?"selected":""}>Annulées et écartées</option><option value="toutes" ${filtre.ventes==="toutes"?"selected":""}>Toutes</option></select></div><div class="row">${types.map(([t,l])=>`<button class="primary" data-new="${t}">${l}</button>`).join("")}</div></div>`}
function parFiltre(l){return chercher(l.filter(e=>filtre.ventes==="toutes"||(filtre.ventes==="actives")===compte(e)))}
function vVentes(){const l=items.filter(e=>deLAnnee(e)&&e.activite==="nowis"&&(e.type==="facture"||e.type==="vente"));
  return `<section><h2>Ventes et factures de Création Nowis</h2><p class="muted small">Anciennes factures (FAC-2026…), nouvelles factures (FAC-00000…) et ventes au comptant réunies. Cliquez une ligne pour la compléter ou la corriger.</p>${barre([["facture","Ajouter une facture"],["vente","Ajouter une vente"]])}${lignes(parFiltre(l))}</section>`}
function vDepenses(){const l=items.filter(e=>deLAnnee(e)&&e.activite==="nowis"&&e.type==="depense");
  return `<section><h2>Dépenses de Création Nowis</h2><p class="muted small">Inscrivez la TPS et la TVQ payées sur chaque achat : elles deviennent vos crédits (CTI) et remboursements (RTI) à partir de votre date d'inscription.</p>${barre([["depense","Ajouter une dépense"]])}${lignes(parFiltre(l),{tiers:"Fournisseur"})}</section>`}
function vImmeubles(){const l=items.filter(e=>deLAnnee(e)&&e.activite==="immeuble"),a=l.filter(compte);
  const noms=[...new Set(a.map(e=>e.immeuble||"Sans immeuble"))].sort();
  return `<section><h2>Immeubles locatifs</h2><p class="muted small">Séparé de Création Nowis : ces montants servent aux formulaires TP-128 (Québec) et T776 (fédéral). Les loyers résidentiels sont exonérés de TPS et de TVQ.</p>
  <div class="tablebox"><table><thead><tr><th>Immeuble</th><th class="num">Votre part</th><th class="num">Loyers encaissés</th><th class="num">Dépenses</th><th class="num">Net (100 %)</th><th class="num">Net · votre part</th></tr></thead><tbody>${noms.map(n=>{const g=a.filter(e=>(e.immeuble||"Sans immeuble")===n),lo=sum(g.filter(e=>e.type==="loyer"),e=>e.total),de=sum(g.filter(e=>e.type==="depense"),e=>e.total),p=g[0]?.part??100;return `<tr><td>${esc(n)}</td><td class="num">${p} %</td><td class="num">${fmt(lo)}</td><td class="num">${fmt(de)}</td><td class="num">${fmt(lo-de)}</td><td class="num">${fmt((lo-de)*p/100)}</td></tr>`}).join("")}</tbody></table></div>
  ${barre([["loyer","Ajouter un loyer"],["depense-immeuble","Ajouter une dépense d'immeuble"]])}${lignes(parFiltre(l),{tiers:"Locataire / fournisseur",immeuble:true})}</section>`}

function calcTaxes(du,au){const ins=regl.dateInscription||"9999";
  const l=items.filter(e=>compte(e)&&e.activite==="nowis"&&e.date>=du&&e.date<=au);
  const v=l.filter(estRevenu),d=l.filter(e=>e.type==="depense"&&e.date>=ins);
  const r={ventes:sum(v,e=>e.sousTotal),tps:sum(v,e=>e.tps),tvq:sum(v,e=>e.tvq),cti:sum(d,e=>e.tps),rti:sum(d,e=>e.tvq),
    avant:regl.dateInscription?v.filter(e=>e.date<ins&&(e.tps||e.tvq)).length:0, sansTaxe:v.filter(e=>e.date>=ins&&!e.tps&&!e.tvq).length};
  r.netTPS=r.tps-r.cti;r.netTVQ=r.tvq-r.rti;return r}
function periodes(){const a=annee,T=[["T1 (janv.–mars)","01-01","03-31"],["T2 (avr.–juin)","04-01","06-30"],["T3 (juill.–sept.)","07-01","09-30"],["T4 (oct.–déc.)","10-01","12-31"],["Année complète","01-01","12-31"]];return T.map(([n,d,f])=>[n,`${a}-${d}`,`${a}-${f}`])}
function vTaxes(){if(!taxe.du){taxe={du:annee+"-01-01",au:annee+"-12-31"}}
  const x=calcTaxes(taxe.du,taxe.au),L=(no,t,v)=>`<div class="formline"><span class="no">${no}</span><span>${t}</span><span class="v">${fmt(v)}</span></div>`;
  return `<section><h2>Déclaration de TPS et de TVQ</h2>
  <p class="muted small">Chiffres à reporter dans le formulaire FPZ-500 de Revenu Québec, que vous remplissez dans Mon dossier pour les entreprises. Les numéros sont ceux des cases du formulaire.</p>
  ${regl.dateInscription?"":`<div class="note">Votre date d'inscription à la TPS/TVQ n'est pas encore inscrite dans les <a href="#reglages">Réglages</a>. Sans elle, aucun crédit (CTI/RTI) n'est calculé sur vos dépenses.</div>`}
  <div class="row">${periodes().map(([n,d,f])=>`<button data-per="${d}|${f}" class="${taxe.du===d&&taxe.au===f?"primary":""}">${n}</button>`).join("")}</div>
  <div class="row"><label style="width:150px">Du<input type="date" id="tdu" value="${taxe.du}"></label><label style="width:150px">Au<input type="date" id="tau" value="${taxe.au}"></label></div>
  <div class="formbox">${L("101","Ventes et autres fournitures (avant taxes)",x.ventes)}${L("103","TPS perçue ou percevable",x.tps)}${L("106","Crédits de taxe sur les intrants (CTI) : TPS payée sur vos dépenses",x.cti)}${L("113","TPS nette à remettre (103 − 106)",x.netTPS)}</div>
  <div class="formbox">${L("203","TVQ perçue ou percevable",x.tvq)}${L("206","Remboursements de la taxe sur les intrants (RTI) : TVQ payée sur vos dépenses",x.rti)}${L("213","TVQ nette à remettre (203 − 206)",x.netTVQ)}</div>
  <div class="formbox">${L("—",x.netTPS+x.netTVQ<0?"Remboursement total demandé":"Total à payer à Revenu Québec",Math.abs(x.netTPS+x.netTVQ))}</div>
  ${x.sansTaxe?`<div class="note">${x.sansTaxe} vente(s) après votre date d'inscription n'ont ni TPS ni TVQ. Vérifiez-les dans <a href="#ventes">Ventes et factures</a>.</div>`:""}
  ${x.avant?`<div class="note">${x.avant} vente(s) portent des taxes avant votre date d'inscription. Vérifiez la date d'inscription ou ces factures.</div>`:""}
  <p class="muted small">Les taxes sont comptées à la date de la facture, qu'elle soit payée ou non. Les factures annulées ou écartées sont exclues. Faites valider vos chiffres par un comptable avant de transmettre.</p></section>`}

function groupe(l,f=e=>e.sousTotal){const m={};l.forEach(e=>{const k=e.categorie||"Non classé";m[k]=(m[k]||0)+f(e)});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
let rsel="resultats",rper={du:"",au:""};
const solde=e=>e.statut==="payee"?0:Math.max(0,e.total-paye(e));
const jours=(a,b)=>Math.floor((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);
const dateFr=d=>d?new Date(d+"T12:00:00").toLocaleDateString("fr-CA",{day:"numeric",month:"long",year:"numeric"}):"";
/* Amortissement (DPA) des biens durables, passé au 31 décembre : une ligne de dépense pour les rapports. */
function amortL(du,au){const L=[];for(let y=+du.slice(0,4);y<=+au.slice(0,4);y++){const d=y+"-12-31",x=amortAnnee(y);if(x&&d>=du&&d<=au)L.push({type:"amort",categorie:"Amortissement (DPA)",date:d,sousTotal:x,tps:0,tvq:0})}return L}
function totauxP(du,au){const n=items.filter(e=>compte(e)&&e.activite==="nowis"&&e.date>=du&&e.date<=au),rev=n.filter(estRevenu),dep=[...n.filter(estCharge),...amortL(du,au)];return{rev:sum(rev,e=>e.sousTotal),dep:sum(dep,cout),revL:rev,depL:dep}}
function ageComptes(list){const T=today(),m={};list.filter(e=>compte(e)&&solde(e)>0).forEach(e=>{const r=jours(e.echeance||e.date,T),k=e.tiers||"Sans nom",b=r<=0?0:r<=30?1:r<=60?2:r<=90?3:4;(m[k]=m[k]||[0,0,0,0,0])[b]+=solde(e)});return Object.entries(m).sort((a,b)=>sum(b[1],x=>x)-sum(a[1],x=>x))}
function tableAge(titre,rows,vide){const tot=[0,1,2,3,4].map(i=>sum(rows,r=>r[1][i]));
  return `<h3>${titre}</h3>${rows.length?`<div class="tablebox"><table><thead><tr><th>Nom</th><th class="num">Pas encore dû</th><th class="num">1 à 30 jours</th><th class="num">31 à 60 jours</th><th class="num">61 à 90 jours</th><th class="num">Plus de 90 jours</th><th class="num">Total</th></tr></thead><tbody>${rows.map(([k,b])=>`<tr><td>${esc(k)}</td>${b.map(x=>`<td class="num">${x?fmt(x):""}</td>`).join("")}<td class="num">${fmt(sum(b,x=>x))}</td></tr>`).join("")}<tr class="total"><td>Total</td>${tot.map(x=>`<td class="num">${fmt(x)}</td>`).join("")}<td class="num">${fmt(sum(tot,x=>x))}</td></tr></tbody></table></div>`:`<p class="muted">${vide}</p>`}`}
function vRapport(){if(!rper.du||rper.du.slice(0,4)!==annee&&rper.auto)rper={du:annee+"-01-01",au:annee+"-12-31",auto:true};
  const onglets=`<div class="row">${[["resultats","État des résultats"],["age","Âge des comptes"],["comparatif","Comparatif"]].map(([k,t])=>`<button data-rap="${k}" class="${rsel===k?"primary":""}">${t}</button>`).join("")}</div>`;
  if(rsel==="age")return `<section><h2>Rapports</h2>${onglets}<p class="muted small">Sommes impayées en date d'aujourd'hui, classées selon le retard par rapport à l'échéance (ou à la date de la facture s'il n'y a pas d'échéance).</p>
   ${tableAge("Comptes clients : ce qu'on vous doit",ageComptes(items.filter(e=>e.type==="facture"||e.type==="vente")),"Aucune facture impayée.")}
   ${tableAge("Comptes fournisseurs : ce que vous devez",ageComptes(items.filter(e=>e.type==="depense")),"Aucune facture de fournisseur impayée.")}</section>`;
  if(rsel==="comparatif"){const ys=[...new Set(items.map(e=>(e.date||"").slice(0,4)).filter(Boolean))].sort().slice(-4),T=ys.map(y=>totauxP(y+"-01-01",y+"-12-31")),G=(k,f)=>T.map(t=>Object.fromEntries(groupe(t[k],f))),R=G("revL"),D=G("depL",cout),cats=g=>[...new Set(g.flatMap(o=>Object.keys(o)))];
    const ec=v=>ys.length>1?`<td class="num">${(v[v.length-1]-v[v.length-2]>=0?"+":"−")+fmt(Math.abs(v[v.length-1]-v[v.length-2]))}</td>`:"",L=(t,v,c="")=>`<tr class="${c}"><td>${esc(t)}</td>${v.map(x=>`<td class="num">${fmt(x)}</td>`).join("")}${ec(v)}</tr>`;
    const mois=[...Array(12).keys()].map(m=>{const mm=String(m+1).padStart(2,"0"),t=totauxP(`${annee}-${mm}-01`,`${annee}-${mm}-31`);return[new Date(2000,m,1).toLocaleDateString("fr-CA",{month:"long"}),t.rev,t.dep]});
    return `<section><h2>Rapports</h2>${onglets}<h3>Création Nowis d'une année à l'autre</h3>
    <div class="tablebox"><table><thead><tr><th></th>${ys.map(y=>`<th class="num">${y}</th>`).join("")}${ys.length>1?`<th class="num">Écart</th>`:""}</tr></thead><tbody>
    <tr><td colspan="${ys.length+2}"><h3>Revenus</h3></td></tr>${cats(R).map(c=>L(c,R.map(o=>o[c]||0))).join("")}${L("Total des revenus",T.map(t=>t.rev),"total")}
    <tr><td colspan="${ys.length+2}"><h3>Dépenses</h3></td></tr>${cats(D).map(c=>L(c,D.map(o=>o[c]||0))).join("")}${L("Total des dépenses",T.map(t=>t.dep),"total")}
    ${L("Bénéfice net",T.map(t=>t.rev-t.dep),"total")}</tbody></table></div>

${VUES.map(([k,t])=>k+" : "+t).join("; ")}.

function lire(){{const pr=$("#f-pasDeRappel");if(pr)cur.pasDeRappel=pr.checked}const g=id=>{const el=$("#f-"+id);return el?el.value:undefined};
  for(const k of["date","numero","echeance","tiers","courriel","categorie","immeuble","description","statut","aVerifier","note"]){const v=g(k);if(v!==undefined)cur[k]=v.trim()}

  if(g("part")!==undefined)cur.part=Math.min(100,Math.max(0,parseFloat(g("part"))||0));
  cur.total=cur.sousTotal+cur.tps+cur.tvq;
  document.querySelectorAll("#pays [data-p]").forEach(el=>{const p=cur.paiements[+el.dataset.p];if(p)p[el.dataset.k]=el.dataset.k==="montant"?parse(el.value):el.value})}
function autoStatut(){if(cur.statut==="annulee"||cur.statut==="ecartee")return;const p=paye(cur);cur.statut=p<=0?"impayee":p>=cur.total?"payee":"partielle"}

  else if(b.id==="addp"){cur.paiements.push({date:today(),montant:Math.max(0,cur.total-paye(cur)),mode:MODES[0],ref:""});autoStatut()}

const cell=v=>`"${String(v??"").replace(/"/g,'""')}"`,m2=c=>((c||0)/100).toFixed(2).replace(".",",");
function csvEcritures(){const H=["Date","Type","Activité","Numéro","Client ou fournisseur","Description","Catégorie","Immeuble","Part %","Avant taxes","TPS","TVQ","Total","Payé","État","Retenu","Source","À vérifier","Notes"];
  const l=items.filter(deLAnnee).sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  return [H.map(cell).join(";"),...l.map(e=>[e.date,TYPES[e.type],e.activite==="nowis"?"Création Nowis":"Immeuble",e.numero,e.tiers,e.description,e.categorie,e.immeuble||"",e.activite==="immeuble"?(e.part??100):"",m2(e.sousTotal),m2(e.tps),m2(e.tvq),m2(e.total),m2(paye(e)),(STATUTS[e.statut]||[e.statut])[0],compte(e)?"oui":"non",e.source,e.aVerifier,e.note].map(cell).join(";"))].join("\r\n")}
function csvRapport(){const t=totaux(),x=calcTaxes(annee+"-01-01",annee+"-12-31"),r=[["Rapport annuel "+annee,regl.nom],[],["REVENUS"]];
  groupe(t.revL).forEach(([k,v])=>r.push([k,m2(v)]));r.push(["Total revenus",m2(t.rev)],[],["DÉPENSES"]);
  groupe(t.depL).forEach(([k,v])=>r.push([k,m2(v)]));r.push(["Total dépenses",m2(t.dep)],["Bénéfice net",m2(t.rev-t.dep)],[],["TPS/TVQ (année)"],["101 Ventes",m2(x.ventes)],["103 TPS perçue",m2(x.tps)],["106 CTI",m2(x.cti)],["113 TPS nette",m2(x.netTPS)],["203 TVQ perçue",m2(x.tvq)],["206 RTI",m2(x.rti)],["213 TVQ nette",m2(x.netTVQ)]);
  return r.map(l=>l.map(cell).join(";")).join("\r\n")}
async function exporter(txt,nom){const data="﻿"+txt;
  if(dl){try{await dl.save({filename:nom,data});toast("Fichier prêt");return}catch(e){if(e&&e.code==="declined")return}}
  const o=$("#csvout");if(o){o.hidden=false;$("#csvtxt").value=txt;$("#csvtxt").select()}}
